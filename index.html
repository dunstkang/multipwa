<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乘法競速</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1923">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --bg2: #162030;
  --bg3: #1d2d40;
  --ink: #e8f0f8;
  --ink-dim: #6a88a8;
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --gold: #ffd700;
  --green: #00e676;
  --red: #ff4444;
  --card: #162030;
  --border: #1e3550;
  --border-bright: #2a4a6a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px;
  color: var(--ink);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(0,212,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(255,107,53,0.06) 0%, transparent 60%);
}

/* ── SPLASH ── */
#screen-splash {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(255,107,53,0.10) 0%, transparent 55%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
}
.splash-symbol {
  font-family: 'Bebas Neue', cursive;
  font-size: 6rem;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
  animation: splash-drop 0.6s cubic-bezier(0.22,1,0.36,1) both;
  text-shadow: 0 0 60px rgba(0,212,255,0.4);
}
@keyframes splash-drop {
  from { transform: translateY(-30px); opacity: 0; }
  to   { transform: translateY(0);     opacity: 1; }
}
.splash-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 3.2rem;
  letter-spacing: 6px;
  color: var(--ink);
  animation: splash-drop 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both;
  margin-bottom: 4px;
}
.splash-sub {
  font-size: 0.85rem; color: var(--ink-dim);
  margin-bottom: 48px;
  animation: splash-drop 0.6s 0.2s cubic-bezier(0.22,1,0.36,1) both;
}
.splash-btn {
  padding: 18px 56px;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.6rem; letter-spacing: 4px;
  border: 2px solid var(--accent);
  border-radius: 4px;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  animation: splash-drop 0.6s 0.3s cubic-bezier(0.22,1,0.36,1) both;
  position: relative;
}
.splash-btn::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 4px;
  box-shadow: 0 0 0 0 rgba(0,212,255,0.5);
  animation: pulse-ring 2s ease-in-out infinite 0.5s;
}
@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(0,212,255,0.45); }
  70%  { box-shadow: 0 0 0 14px rgba(0,212,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); }
}
.splash-btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 40px rgba(0,212,255,0.3); }
.splash-meta {
  position: absolute; bottom: 24px;
  text-align: center; font-size: 0.75rem; color: var(--ink-dim); opacity: 0.6;
}
.splash-meta .sv { color: var(--accent); font-family: 'Bebas Neue', cursive; font-size: 0.9rem; }

/* ── UPDATE BAR ── */
#update-bar {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
  background: #0a3a1a; border-top: 2px solid var(--green);
  padding: 12px 20px; align-items: center; justify-content: space-between;
  gap: 12px; font-size: 0.9rem; color: var(--ink);
  box-shadow: 0 -4px 20px rgba(0,230,118,0.2);
}
#update-bar button {
  padding: 8px 20px; background: var(--green); color: #0a2a14;
  border: none; border-radius: 4px; font-weight: 900;
  cursor: pointer; font-size: 0.9rem; white-space: nowrap;
}

/* ── SCREEN ── */
.screen { display: none; width: 100%; max-width: 480px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ── TOP BAR ── */
.top-bar {
  width: 100%; display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 6px;
}
#version-tag { font-size: 0.68rem; color: var(--ink-dim); opacity: 0.45; }
.page-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem; letter-spacing: 3px; color: var(--ink);
  margin-bottom: 20px; width: 100%; text-align: center;
}
.page-title span { color: var(--accent); }

/* ── MENU CARDS ── */
.card {
  width: 100%; background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--ink-dim); margin-bottom: 12px; font-weight: 700;
}

/* 模式選擇 — 兩個大按鈕 */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-btn {
  padding: 20px 10px 16px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--ink-dim);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  position: relative;
}
.mode-btn .m-icon {
  font-family: 'Bebas Neue', cursive;
  font-size: 2rem; color: var(--accent); display: block; margin-bottom: 4px;
}
.mode-btn .m-label { font-size: 1rem; font-weight: 700; display: block; }
.mode-btn .m-sub { font-size: 0.75rem; color: var(--ink-dim); display: block; margin-top: 2px; }
.mode-btn.selected {
  border-color: var(--accent);
  background: rgba(0,212,255,0.08);
  color: var(--ink);
}
.mode-btn.selected .m-sub { color: var(--accent); }
.mode-btn:hover:not(.selected) { border-color: var(--border-bright); color: var(--ink); }

/* 難度選擇 — 四個按鈕 */
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.diff-btn {
  padding: 14px 8px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--ink-dim);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: 'Noto Sans TC', sans-serif;
}
.diff-btn .d-level { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; color: var(--accent); display: block; margin-bottom: 2px; }
.diff-btn .d-expr { font-size: 1rem; font-weight: 900; display: block; }
.diff-btn .d-range { font-size: 0.72rem; color: var(--ink-dim); display: block; margin-top: 2px; }
.diff-btn.selected { border-color: var(--accent2); background: rgba(255,107,53,0.08); }
.diff-btn.selected .d-level { color: var(--accent2); }
.diff-btn:hover:not(.selected) { border-color: var(--border-bright); color: var(--ink); }

.start-btn {
  width: 100%;
  padding: 18px;
  background: var(--accent);
  color: var(--bg);
  border: none; border-radius: 8px;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.6rem; letter-spacing: 3px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  margin-bottom: 10px;
}
.start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.start-btn:active { transform: translateY(0); }
.score-link-btn {
  width: 100%; padding: 12px;
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.95rem; cursor: pointer;
  transition: all 0.15s;
}
.score-link-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── GAME SCREEN ── */
.game-header {
  width: 100%; display: flex;
  justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.back-btn {
  background: none; border: 1px solid var(--border);
  color: var(--ink-dim); padding: 7px 14px; border-radius: 6px;
  cursor: pointer; font-size: 0.85rem; transition: all 0.15s;
}
.back-btn:hover { border-color: var(--ink-dim); color: var(--ink); }

/* 計時 / 進度 HUD */
.hud {
  width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 20px;
}
.hud-cell {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 8px; text-align: center;
}
.hud-cell .hc-label { font-size: 0.65rem; letter-spacing: 2px; color: var(--ink-dim); text-transform: uppercase; }
.hud-cell .hc-val {
  font-family: 'Bebas Neue', cursive; font-size: 1.8rem;
  color: var(--accent); line-height: 1; margin-top: 2px;
}
.hud-cell.hud-time .hc-val { color: var(--gold); }
.hud-cell.hud-score .hc-val { color: var(--green); }
.hud-cell.hud-err .hc-val { color: var(--red); }
.hud-cell.hud-time.warning .hc-val { color: var(--red); animation: blink-time 0.5s ease-in-out infinite; }
@keyframes blink-time { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* 進度條（十題模式） */
.progress-bar-wrap {
  width: 100%; height: 6px;
  background: var(--bg3); border-radius: 3px;
  margin-bottom: 24px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
}

/* 題目區 */
.question-area {
  width: 100%; text-align: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 24px 28px;
  margin-bottom: 20px; position: relative; overflow: hidden;
}
.question-area::before {
  content: '×';
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font-family: 'Bebas Neue', cursive; font-size: 8rem;
  color: rgba(0,212,255,0.04); pointer-events: none;
}
.q-num-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 12px; }
.q-expr {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(2.6rem, 10vw, 3.8rem);
  color: var(--ink);
  letter-spacing: 4px;
  line-height: 1;
  margin-bottom: 24px;
}
.q-expr .op { color: var(--accent); }

/* 答案輸入 */
.answer-row {
  display: flex; gap: 10px; align-items: center; justify-content: center;
}
.answer-input {
  font-family: 'Bebas Neue', cursive;
  font-size: 2.4rem;
  width: 180px; padding: 12px 16px;
  background: var(--bg); border: 2px solid var(--border-bright);
  border-radius: 8px; color: var(--accent);
  text-align: center; outline: none;
  letter-spacing: 4px;
  transition: border-color 0.15s, box-shadow 0.15s;
  caret-color: var(--accent);
}
.answer-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.15); }
.answer-input.correct {
  border-color: var(--green);
  box-shadow: 0 0 20px rgba(0,230,118,0.25);
  animation: flash-correct 0.35s ease;
}
.answer-input.wrong {
  border-color: var(--red);
  box-shadow: 0 0 20px rgba(255,68,68,0.3);
  animation: shake 0.45s ease;
}
@keyframes flash-correct {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.submit-btn {
  padding: 14px 20px;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 8px;
  font-family: 'Bebas Neue', cursive; font-size: 1.4rem;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.submit-btn:hover { opacity: 0.85; }
.submit-btn:active { transform: scale(0.95); }

/* 即時回饋 */
.feedback-row {
  min-height: 28px; text-align: center;
  font-size: 0.9rem; margin-top: 12px;
  font-weight: 700; transition: opacity 0.2s;
}
.feedback-row.fb-correct { color: var(--green); }
.feedback-row.fb-wrong { color: var(--red); }

/* ── 結算畫面 ── */
.result-hero {
  width: 100%; background: var(--card);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 28px 24px; text-align: center; margin-bottom: 14px;
}
.result-grade {
  font-family: 'Bebas Neue', cursive;
  font-size: 5rem; line-height: 1;
  margin-bottom: 4px;
}
.result-grade.grade-s { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.4); }
.result-grade.grade-a { color: var(--green); }
.result-grade.grade-b { color: var(--accent); }
.result-grade.grade-c { color: var(--accent2); }
.result-grade.grade-d { color: var(--ink-dim); }
.result-tagline { font-size: 0.85rem; color: var(--ink-dim); margin-bottom: 20px; }
.result-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.rs-cell { background: var(--bg3); border-radius: 8px; padding: 12px 8px; }
.rs-cell .rs-label { font-size: 0.65rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; }
.rs-cell .rs-val { font-family: 'Bebas Neue', cursive; font-size: 1.6rem; color: var(--ink); margin-top: 4px; }

.result-list {
  width: 100%; display: flex; flex-direction: column; gap: 6px;
  max-height: 260px; overflow-y: auto; margin-bottom: 14px;
}
.result-row {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
}
.result-row .rr-expr { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; color: var(--ink); letter-spacing: 2px; }
.result-row .rr-ans { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; }
.result-row.rr-ok  { border-color: rgba(0,230,118,0.2); }
.result-row.rr-ok .rr-ans { color: var(--green); }
.result-row.rr-bad { border-color: rgba(255,68,68,0.2); background: rgba(255,68,68,0.04); }
.result-row.rr-bad .rr-ans { color: var(--red); }
.result-row .rr-correct-ans { font-size: 0.8rem; color: var(--ink-dim); margin-left: 8px; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.btn-retry {
  padding: 14px; background: var(--accent); color: var(--bg);
  border: none; border-radius: 8px;
  font-family: 'Bebas Neue', cursive; font-size: 1.3rem; letter-spacing: 2px;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-retry:hover { opacity: 0.85; }
.btn-menu {
  padding: 14px; background: transparent; color: var(--ink-dim);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Bebas Neue', cursive; font-size: 1.3rem; letter-spacing: 2px;
  cursor: pointer; transition: all 0.15s;
}
.btn-menu:hover { border-color: var(--ink-dim); color: var(--ink); }

/* ── 成績榜 ── */
.scores-section {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
}
.scores-section h3 {
  font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px;
  color: var(--gold); margin-bottom: 10px;
  border-left: 3px solid var(--gold); padding-left: 10px;
}
.scores-table { width: 100%; border-collapse: collapse; }
.scores-table th { font-size: 0.72rem; color: var(--ink-dim); font-weight: 400; text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.scores-table td { padding: 8px 8px; font-size: 0.9rem; border-bottom: 1px solid rgba(30,53,80,0.5); }
.rank-1 td:first-child { color: var(--gold); font-size: 1.1rem; }
.rank-2 td:first-child { color: #c0c0c0; }
.rank-3 td:first-child { color: #cd7f32; }
.scores-empty { color: var(--ink-dim); font-size: 0.85rem; padding: 8px; }
.export-btn {
  width: 100%; margin-top: 8px; padding: 10px;
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
}
.export-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── 30秒模式 — 倒數圓弧 ── */
#countdown-ring { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; }
#countdown-ring svg { transform: rotate(-90deg); }
#ring-track { fill: none; stroke: var(--bg3); stroke-width: 6; }
#ring-fill  { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear; }
#countdown-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', cursive; font-size: 2.2rem; color: var(--gold);
}
#countdown-ring.warning #ring-fill { stroke: var(--red); }
#countdown-ring.warning #countdown-num { color: var(--red); }

/* ══════════════════════════════════
   RACE MODE
══════════════════════════════════ */
#race-track-wrap { background: #0a1520; }
#race-canvas { image-rendering: pixelated; }
</style>
</head>
<body>

<!-- 更新提示條 -->
<div id="update-bar">
  <span>🎉 新版本可用！</span>
  <button onclick="location.reload()">立即更新</button>
</div>

<!-- SPLASH -->
<div id="screen-splash">
  <div class="splash-symbol">×</div>
  <h1 class="splash-title">乘法競速</h1>
  <p class="splash-sub">十題競速 &amp; 30秒極限挑戰</p>
  <button class="splash-btn" onclick="splashStart()">START</button>
  <div class="splash-meta">
    <div class="sv" id="splash-version"></div>
    <div>乘法競速版 · Multiplication Sprint</div>
  </div>
</div>

<!-- MENU -->
<div class="screen active" id="screen-menu">
  <div class="top-bar">
    <div id="version-tag"></div>
    <div></div>
  </div>
  <div class="page-title" id="menu-title">乘法<span>競速</span></div>

  <div class="card">
    <div class="card-title">遊戲類型</div>
    <div class="mode-grid">
      <button class="mode-btn selected" data-group="type" data-val="mult">
        <span class="m-icon">×</span>
        <span class="m-label">乘法</span>
        <span class="m-sub">Multiplication</span>
      </button>
      <button class="mode-btn" data-group="type" data-val="div">
        <span class="m-icon">÷</span>
        <span class="m-label">除法</span>
        <span class="m-sub">Division</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">遊戲模式</div>
    <div class="mode-grid">
      <button class="mode-btn selected" data-group="mode" data-val="ten">
        <span class="m-icon">10</span>
        <span class="m-label">十題競速</span>
        <span class="m-sub">答完10題，拼最快時間</span>
      </button>
      <button class="mode-btn" data-group="mode" data-val="sprint">
        <span class="m-icon">30</span>
        <span class="m-label">30秒競速</span>
        <span class="m-sub">限時30秒，拼最多答題</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">難度</div>
    <div class="diff-grid" id="diff-grid">
      <!-- 動態填入 -->
    </div>
  </div>

  <button class="start-btn" id="start-btn">開始挑戰</button>
  <button class="score-link-btn" style="border-color:var(--accent2);color:var(--accent2)" onclick="showScreen('race-menu')">🏎️ 賽車模式</button>
  <button class="score-link-btn" onclick="showScreen('scores')">🏆 查看成績記錄</button>
</div>

<!-- RACE MENU -->
<div class="screen" id="screen-race-menu">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('menu')">◀ 返回</button>
    <div id="race-version-tag"></div>
  </div>
  <div class="page-title">賽車<span>競速</span></div>

  <div class="card">
    <div class="card-title">遊戲類型</div>
    <div class="mode-grid">
      <button class="mode-btn selected" data-group="race-type" data-val="mult">
        <span class="m-icon">×</span>
        <span class="m-label">乘法</span>
        <span class="m-sub">Multiplication</span>
      </button>
      <button class="mode-btn" data-group="race-type" data-val="div">
        <span class="m-icon">÷</span>
        <span class="m-label">除法</span>
        <span class="m-sub">Division</span>
      </button>
    </div>

<script>
// ── 工具 ──
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// 難度定義
const DIFF_CONFIG = {
  mult: [
    { val:'1x1', level:'LV 1', expr:'個位 × 個位', range:'2~9 × 2~9' },
    { val:'2x1', level:'LV 2', expr:'二位 × 個位', range:'11~99 × 2~9' },
    { val:'3x1', level:'LV 3', expr:'三位 × 個位', range:'101~999 × 2~9' },
    { val:'2x2', level:'LV 4', expr:'二位 × 二位', range:'11~99 × 11~99' },
  ],
  div: [
    { val:'d2x1', level:'LV 1', expr:'二位 ÷ 個位', range:'被除數 10~99' },
    { val:'d3x1', level:'LV 2', expr:'三位 ÷ 個位', range:'被除數 100~999' },
    { val:'d3x2', level:'LV 3', expr:'三位 ÷ 二位', range:'被除數 100~999' },
  ]
};

function renderDiffGrid(type) {
  const grid = document.getElementById('diff-grid');
  const defs = DIFF_CONFIG[type];
  grid.innerHTML = defs.map((d, i) =>
    `<button class="diff-btn${i===0?' selected':''}" data-group="diff" data-val="${d.val}">
      <span class="d-level">${d.level}</span>
      <span class="d-expr">${d.expr}</span>
      <span class="d-range">${d.range}</span>
    </button>`
  ).join('');
  // 重新綁定按鈕事件
  grid.querySelectorAll('[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      grid.querySelectorAll('[data-group="diff"]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.diff = btn.dataset.val;
    });
  });
  // 預設選第一個
  state.diff = defs[0].val;
}

function genQuestion(type, diff) {
  let a, b, ans, expr;
  if (type === 'mult') {
    switch (diff) {
      case '1x1': a = rand(2,9);    b = rand(2,9);    break;
      case '2x1': a = rand(11,99);  b = rand(2,9);    break;
      case '3x1': a = rand(101,999); b = rand(2,9);   break;
      case '2x2': a = rand(11,99);  b = rand(11,99);  break;
    }
    ans = a * b;
    expr = `${a} <span class="op">×</span> ${b}`;
  } else {
    // 除法：先決定除數，再決定商，相乘得被除數，保證整除
    switch (diff) {
      case 'd2x1': {
        b = rand(2, 9);
        // 商的範圍讓被除數落在 10~99
        const qMin = Math.ceil(10 / b), qMax = Math.floor(99 / b);
        const q = rand(qMin, qMax);
        a = b * q; ans = q; break;
      }
      case 'd3x1': {
        b = rand(2, 9);
        const qMin = Math.ceil(100 / b), qMax = Math.floor(999 / b);
        const q = rand(qMin, qMax);
        a = b * q; ans = q; break;
      }
      case 'd3x2': {
        b = rand(11, 99);
        const qMin = Math.ceil(100 / b), qMax = Math.floor(999 / b);
        if (qMin > qMax) { b = rand(11,32); const q2 = rand(4,9); a = b*q2; ans = q2; break; }
        const q = rand(qMin, qMax);
        a = b * q; ans = q; break;
      }
    }
    expr = `${a} <span class="op">÷</span> ${b}`;
  }
  return { a, b, ans, expr };
}

// ── 狀態 ──
let state = {
  type: 'mult',  // 'mult' | 'div'
  mode: 'ten',   // 'ten' | 'sprint'
  diff: '1x1',
  questions: [],
  qi: 0,         // 當前題目 index（ten模式）
  correct: 0,
  errors: 0,
  elapsed: 0,    // 十題模式計時（秒）
  remaining: 30, // 30秒模式倒數
  timer: null,
  timerStart: 0,
  log: [],       // { expr, userAns, correct, ok }
  running: false,
};

// ── 畫面切換 ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  if (id === 'scores') renderScores();
}

function splashStart() {
  document.getElementById('screen-splash').style.display = 'none';
}

// ── 選項按鈕 ──
document.querySelectorAll('[data-group]').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = btn.dataset.group;
    document.querySelectorAll(`[data-group="${g}"]`).forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state[g] = btn.dataset.val;
    // 切換遊戲類型時，動態更新難度選單和標題
    if (g === 'type') {
      const titles = { mult: '乘法<span>競速</span>', div: '除法<span>競速</span>' };
      document.getElementById('menu-title').innerHTML = titles[btn.dataset.val];
      renderDiffGrid(btn.dataset.val);
    }
  });
});

// 初始化難度選單（乘法）
renderDiffGrid('mult');

// ── 開始遊戲 ──
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('game-back-btn').addEventListener('click', () => {
  clearInterval(state.timer);
  state.running = false;
  showScreen('menu');
});
document.getElementById('result-retry-btn').addEventListener('click', startGame);

function startGame() {
  clearInterval(state.timer);
  state.correct = 0;
  state.errors  = 0;
  state.elapsed = 0;
  state.remaining = 30;
  state.log = [];
  state.running = true;

  const isSprint = state.mode === 'sprint';
  const typeLabel = state.type === 'div' ? '除法' : '乘法';
  document.getElementById('game-mode-label').textContent = `${typeLabel} · ${isSprint ? '30 秒競速' : '十題競速'}`;
  document.getElementById('progress-wrap').style.display = isSprint ? 'none' : 'block';
  document.getElementById('countdown-ring').style.display = isSprint ? 'block' : 'none';

  // HUD label 依模式
  document.getElementById('hud-time-label').textContent = isSprint ? '剩餘' : '時間';
  document.getElementById('hud-score-label').textContent = isSprint ? '答對' : '答對';

  updateHUD();
  showScreen('game');

  if (!isSprint) {
    // 十題模式：生成10題，計時開始
    state.questions = Array.from({length:10}, () => genQuestion(state.type, state.diff));
    state.qi = 0;
    state.timerStart = performance.now();
    state.timer = setInterval(() => {
      state.elapsed = (performance.now() - state.timerStart) / 1000;
      updateHUD();
    }, 100);
    showQuestion();
  } else {
    // 30秒模式：無限題，倒數
    state.remaining = 30;
    setRing(30, 30);
    state.timerStart = performance.now();
    state.timer = setInterval(() => {
      state.remaining = 30 - (performance.now() - state.timerStart) / 1000;
      if (state.remaining <= 0) {
        state.remaining = 0;
        clearInterval(state.timer);
        state.running = false;
        updateHUD();
        setRing(0, 30);
        setTimeout(endGame, 300);
        return;
      }
      updateHUD();
      setRing(state.remaining, 30);
      // warning
      const ring = document.getElementById('countdown-ring');
      const hud  = document.getElementById('hud-time');
      if (state.remaining <= 10) {
        ring.classList.add('warning');
        hud.classList.add('warning');
      }
    }, 100);
    showQuestion();
  }
}

function showQuestion() {
  const isSprint = state.mode === 'sprint';
  let q;
  if (!isSprint) {
    if (state.qi >= 10) { endGame(); return; }
    q = state.questions[state.qi];
    document.getElementById('q-num-label').textContent = `QUESTION ${state.qi + 1} / 10`;
    document.getElementById('progress-bar').style.width = `${(state.qi / 10) * 100}%`;
  } else {
    q = genQuestion(state.type, state.diff);
    state.currentQ = q;
    document.getElementById('q-num-label').textContent = `第 ${state.log.length + 1} 題`;
  }
  state.currentQ = q;
  document.getElementById('q-expr').innerHTML = q.expr;
  const input = document.getElementById('answer-input');
  input.value = '';
  input.className = 'answer-input';
  input.focus();
  clearFeedback();
}

function clearFeedback() {
  const fb = document.getElementById('feedback-row');
  fb.textContent = '';
  fb.className = 'feedback-row';
}

function submitAnswer() {
  if (!state.running) return;
  const input = document.getElementById('answer-input');
  const val = parseInt(input.value, 10);
  if (isNaN(val) || input.value.trim() === '') return;
  const q = state.currentQ;
  const ok = val === q.ans;

  state.log.push({ expr: q.expr.replace(/<[^>]+>/g,''), userAns: val, correct: q.ans, ok });

  if (ok) {
    state.correct++;
    input.className = 'answer-input correct';
    showFeedback('✓  正確！', true);
  } else {
    state.errors++;
    input.className = 'answer-input wrong';
    showFeedback(`✗  正確答案是 ${q.ans}`, false);
  }

  updateHUD();

  const delay = ok ? 350 : 900;
  setTimeout(() => {
    if (!state.running && state.mode === 'sprint') return;
    if (state.mode === 'ten') state.qi++;
    showQuestion();
  }, delay);
}

function showFeedback(msg, ok) {
  const fb = document.getElementById('feedback-row');
  fb.textContent = msg;
  fb.className = 'feedback-row ' + (ok ? 'fb-correct' : 'fb-wrong');
}

function updateHUD() {
  const isSprint = state.mode === 'sprint';
  document.getElementById('hud-time-val').textContent =
    isSprint ? Math.ceil(state.remaining) + 's' : state.elapsed.toFixed(1) + 's';
  document.getElementById('hud-score-val').textContent = state.correct;
  document.getElementById('hud-err-val').textContent   = state.errors;
}

// 圓弧
const RING_CIRC = 2 * Math.PI * 44; // 276.46
function setRing(current, total) {
  const pct = current / total;
  document.getElementById('ring-fill').style.strokeDashoffset = RING_CIRC * (1 - pct);
  document.getElementById('countdown-num').textContent = Math.ceil(current);
}

// 送出按鈕 & Enter
document.getElementById('submit-btn').addEventListener('click', submitAnswer);
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

// ── 結算 ──
function endGame() {
  clearInterval(state.timer);
  state.running = false;

  const isSprint = state.mode === 'sprint';
  const time = isSprint ? 30 : parseFloat(state.elapsed.toFixed(1));
  const correct = state.correct;
  const errors  = state.errors;
  const total   = state.log.length;

  // 評等
  let grade, tagline;
  if (!isSprint) {
    const t = time;
    if (errors === 0 && t < 15) { grade='S'; tagline='完美神速！'; }
    else if (errors === 0 && t < 25) { grade='A'; tagline='完美作答！'; }
    else if (errors <= 1 && t < 35) { grade='B'; tagline='表現不錯！'; }
    else if (errors <= 3) { grade='C'; tagline='繼續加油！'; }
    else { grade='D'; tagline='多多練習！'; }
  } else {
    if (correct >= 25) { grade='S'; tagline='30秒答對25題！'; }
    else if (correct >= 18) { grade='A'; tagline='非常厲害！'; }
    else if (correct >= 12) { grade='B'; tagline='表現不錯！'; }
    else if (correct >= 6)  { grade='C'; tagline='繼續加油！'; }
    else { grade='D'; tagline='多多練習！'; }
  }

  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-grade').className = 'result-grade grade-' + grade.toLowerCase();
  document.getElementById('result-tagline').textContent = tagline;

  if (!isSprint) {
    document.getElementById('rs-label-a').textContent = '時間';
    document.getElementById('rs-val-a').textContent   = time + 's';
  } else {
    document.getElementById('rs-label-a').textContent = '答題數';
    document.getElementById('rs-val-a').textContent   = total;
  }
  document.getElementById('rs-val-correct').textContent = correct;
  document.getElementById('rs-val-errors').textContent  = errors;

  // 題目列表
  const list = document.getElementById('result-list');
  list.innerHTML = '';
  state.log.forEach(item => {
    const row = document.createElement('div');
    row.className = 'result-row ' + (item.ok ? 'rr-ok' : 'rr-bad');
    row.innerHTML = `
      <span class="rr-expr">${item.expr} = ${item.correct}</span>
      <span class="rr-ans">
        ${item.ok ? '✓ ' + item.userAns : '✗ ' + item.userAns}
        ${!item.ok ? `<span class="rr-correct-ans">（正解：${item.correct}）</span>` : ''}
      </span>`;
    list.appendChild(row);
  });

  // 存成績（先存再渲染，這樣本次成績也會出現在榜上）
  saveScore({ type: state.type, mode: state.mode, diff: state.diff, time, correct, errors, total });

  // 本模式最佳成績
  renderResultBest(state.type, state.mode, state.diff, isSprint ? { correct } : { time });

  showScreen('result');
}

function renderResultBest(type, mode, diff, thisResult) {
  const scores = JSON.parse(localStorage.getItem(SCORES_KEY) || '{}');
  const key = `${type}_${mode}_${diff}`;
  const rows = scores[key] || [];
  const isSprint = mode === 'sprint';
  const medals = ['🥇','🥈','🥉','4','5'];
  const diffLabel = {
    '1x1':'個位×個位','2x1':'二位×個位','3x1':'三位×個位','2x2':'二位×二位',
    'd2x1':'二位÷個位','d3x1':'三位÷個位','d3x2':'三位÷二位'
  };
  const modeLabel = { ten:'十題競速', sprint:'30秒競速' };
  const typeLabel = { mult:'乘法', div:'除法' };

  // 找出本次成績在排行中的位置（0-based）
  const myRank = isSprint
    ? rows.findIndex(r => r.correct === thisResult.correct)
    : rows.findIndex(r => r.time === thisResult.time);

  let html = `
    <div class="scores-section" style="margin-bottom:0">
      <h3>🏅 ${typeLabel[type]} ${modeLabel[mode]} — ${diffLabel[diff]}</h3>
      <table class="scores-table">
        <tr>
          <th>名次</th>
          ${isSprint ? '<th>答對</th><th>答題</th>' : '<th>時間</th>'}
          <th>失誤</th><th>日期</th>
        </tr>`;

  rows.forEach((r, i) => {
    const isMe = i === myRank;
    html += `<tr class="rank-${i+1}" style="${isMe ? 'background:rgba(0,212,255,0.08);outline:1px solid var(--accent);outline-offset:-1px;border-radius:6px' : ''}">
      <td>${medals[i] || i+1} ${isMe ? '◀' : ''}</td>
      ${isSprint
        ? `<td style="color:var(--green);font-weight:700">${r.correct}</td><td style="color:var(--ink-dim);font-size:.8rem">${r.total}題</td>`
        : `<td style="color:var(--gold);font-weight:700">${r.time}s</td>`}
      <td>${r.errors}次</td>
      <td style="font-size:.75rem;color:var(--ink-dim)">${r.date || ''}</td>
    </tr>`;
  });

  html += `</table></div>`;
  document.getElementById('result-best').innerHTML = html;
}

// ── 成績記錄 ──
const SCORES_KEY = 'multPWA_scores';

function saveScore({ type, mode, diff, time, correct, errors, total }) {
  const scores = JSON.parse(localStorage.getItem(SCORES_KEY) || '{}');
  const key = `${type}_${mode}_${diff}`;
  if (!scores[key]) scores[key] = [];

  const date = new Date().toLocaleDateString('zh-TW');
  const entry = { time, correct, errors, total, date };

  scores[key].push(entry);

  // 排序：十題模式依時間升冪，30秒依答對降冪
  scores[key].sort((a, b) =>
    mode === 'ten' ? a.time - b.time : b.correct - a.correct
  );
  scores[key] = scores[key].slice(0, 5);

  localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
}

function renderScores() {
  const scores = JSON.parse(localStorage.getItem(SCORES_KEY) || '{}');
  const container = document.getElementById('scores-content');
  container.innerHTML = '';

  const medals = ['🥇','🥈','🥉','4','5'];
  const diffLabel = {
    '1x1':'個位×個位','2x1':'二位×個位','3x1':'三位×個位','2x2':'二位×二位',
    'd2x1':'二位÷個位','d3x1':'三位÷個位','d3x2':'三位÷二位'
  };
  const modeLabel = { ten:'十題競速', sprint:'30秒競速' };
  const typeLabel = { mult:'乘法', div:'除法' };

  const allKeys = Object.keys(scores).sort();
  if (allKeys.length === 0) {
    container.innerHTML = '<p style="color:var(--ink-dim);text-align:center;padding:24px;font-size:0.9rem">還沒有成績記錄，快去挑戰！</p>';
    return;
  }

  allKeys.forEach(key => {
    const rows = scores[key];
    if (!rows || rows.length === 0) return;
    const parts = key.split('_');
    // key 格式: type_mode_diff（新）或 mode_diff（舊，相容）
    let type, mode, diff;
    if (parts.length === 3) { [type, mode, diff] = parts; }
    else { type = 'mult'; [mode, diff] = parts; }
    const isSprint = mode === 'sprint';
    const section = document.createElement('div');
    section.className = 'scores-section';
    section.innerHTML = `<h3>${typeLabel[type]||''} ${modeLabel[mode] || mode} — ${diffLabel[diff] || diff}</h3>
      <table class="scores-table">
        <tr>
          <th>名次</th>
          ${isSprint ? '<th>答對</th><th>答題</th>' : '<th>時間</th>'}
          <th>失誤</th><th>日期</th>
        </tr>
        ${rows.map((r,i) => `
          <tr class="rank-${i+1}">
            <td>${medals[i]||i+1}</td>
            ${isSprint
              ? `<td style="color:var(--green);font-weight:700">${r.correct}</td><td style="color:var(--ink-dim);font-size:.8rem">${r.total}題</td>`
              : `<td style="color:var(--gold);font-weight:700">${r.time}s</td>`}
            <td>${r.errors}次</td>
            <td style="font-size:.75rem;color:var(--ink-dim)">${r.date||''}</td>
          </tr>`).join('')}
      </table>`;
    container.appendChild(section);
  });
}

function exportScores() {
  const data = localStorage.getItem(SCORES_KEY) || '{}';
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mult-scores.json';
  a.click();
}

// ── Load ghost speeds from scores ──
function loadGhostSpeeds(type, diff, trackLen) {
  const key = `${type}_${diff}_${trackLen}`;
  const scores = JSON.parse(localStorage.getItem(RACE_SCORES_KEY) || '{}');
  const runs = scores[key] || [];
  // runs sorted best (lowest time) first
  // ghosts[0] = player (live), [1]=last run, [2-4]=top3, [5]=prev-prev
  const speeds = Array(6).fill(null);
  // last run = runs[runs.length-1] (chronological last, stored separately)
  const lastRun   = scores[key + '_last']   || null;
  const prevRun   = scores[key + '_prevprev'] || null;
  if (lastRun)  speeds[1] = lastRun.time / trackLen;   // sec per step
  if (runs[0])  speeds[2] = runs[0].time / trackLen;
  if (runs[1])  speeds[3] = runs[1].time / trackLen;
  if (runs[2])  speeds[4] = runs[2].time / trackLen;
  if (prevRun)  speeds[5] = prevRun.time / trackLen;
  return speeds;
}

function stopRaceTimers() {
  clearInterval(raceState.timer);
  raceState.ghostTimers.forEach(t => clearInterval(t));
  raceState.ghostTimers = [];
  raceState.running = false;
}

// ── Start race ──
function startRace() {
  stopRaceTimers();

  const tl = raceState.trackLen;
  raceState.qi = 0;
  raceState.correct = 0;
  raceState.errors = 0;
  raceState.elapsed = 0;
  raceState.positions = Array(6).fill(0);
  raceState.playerTimes = [];
  raceState.running = true;

  const typeLabel = raceState.type === 'div' ? '除法' : '乘法';
  const trackLabel = {5:'短賽道',10:'中賽道',20:'長賽道',50:'耐力賽'}[tl] || tl+'題';
  document.getElementById('race-mode-label').textContent = `${typeLabel} · ${trackLabel}`;
  document.getElementById('race-q-counter').textContent = `0/${tl}`;

  // Init canvas
  initRaceCanvas(tl);

  // Load ghost speeds
  const ghostSpeeds = loadGhostSpeeds(raceState.type, raceState.diff, tl);
  raceState.ghosts = ghostSpeeds;

  // Start player timer
  raceState.timerStart = performance.now();
  raceState.timer = setInterval(() => {
    raceState.elapsed = (performance.now() - raceState.timerStart) / 1000;
    document.getElementById('race-time-val').textContent = raceState.elapsed.toFixed(1) + 's';
    drawRace();
  }, 100);

  // Start ghost timers (only lanes with known speed)
  raceState.ghostTimers = [];
  for (let lane = 1; lane <= 5; lane++) {
    const spd = raceState.ghosts[lane]; // sec/step
    if (spd === null) continue;
    let steps = 0;
    const t = setInterval(() => {
      if (!raceState.running) { clearInterval(t); return; }
      steps++;
      raceState.positions[lane] = Math.min(steps, tl);
      if (steps >= tl) clearInterval(t);
    }, spd * 1000);
    raceState.ghostTimers.push(t);
  }

  // Bot fallback: lanes with no history start as null,
  // after player answers 3, we compute fallback speeds
  // (handled in raceSubmit)

  showScreen('race-game');
  raceNextQuestion();
}

// ── Canvas ──
let raceCanvasData = { tl:10, laneH:0, w:0, totalH:0 };

function initRaceCanvas(tl) {
  const canvas = document.getElementById('race-canvas');
  const wrap   = document.getElementById('race-track-wrap');
  const w = wrap.clientWidth || 360;
  const laneH = 44;
  const totalH = 6 * laneH + 20; // 6 lanes + padding
  canvas.width  = w;
  canvas.height = totalH;
  canvas.style.height = totalH + 'px';
  raceCanvasData = { tl, laneH, w, totalH };
}

function drawRace() {
  const canvas = document.getElementById('race-canvas');
  const ctx    = canvas.getContext('2d');
  const { tl, laneH, w, totalH } = raceCanvasData;

  ctx.clearRect(0, 0, w, totalH);

  // Background
  ctx.fillStyle = '#0a1520';
  ctx.fillRect(0, 0, w, totalH);

  // Track area margins
  const trackX = 52;  // left margin for labels
  const trackW = w - trackX - 12;
  const finishX = trackX + trackW;
  const startX  = trackX;

  // Finish line
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(finishX, 8); ctx.lineTo(finishX, totalH-8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('FINISH', finishX - 2, 16);

  // Start line
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(startX, 8); ctx.lineTo(startX, totalH-8); ctx.stroke();

  for (let lane = 0; lane < 6; lane++) {
    const y = 10 + lane * laneH;
    const color = LANE_COLORS[lane];
    const label = LANE_LABELS[lane];
    const pos   = raceState.positions[lane]; // 0..tl
    const hasData = lane === 0 || raceState.ghosts[lane] !== null;

    // Lane strip
    ctx.fillStyle = lane % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.15)';
    ctx.fillRect(trackX, y, trackW, laneH - 2);

    // Lane label
    ctx.fillStyle = hasData ? color : 'rgba(100,130,160,0.4)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(label, trackX - 4, y + laneH/2 + 4);

    if (!hasData) {
      // No ghost data — draw dashed empty lane
      ctx.strokeStyle = 'rgba(100,130,160,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6,6]);
      ctx.beginPath();
      ctx.moveTo(trackX, y + laneH/2);
      ctx.lineTo(finishX, y + laneH/2);
      ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }

    // Progress trail
    const carX = startX + (pos / tl) * trackW;
    if (pos > 0) {
      ctx.fillStyle = color + '22';
      ctx.fillRect(startX, y + 8, carX - startX, laneH - 18);
    }

    // Dot markers for each step
    for (let s = 1; s <= tl; s++) {
      const sx = startX + (s / tl) * trackW;
      ctx.fillStyle = s <= pos ? color + '55' : 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.arc(sx, y + laneH/2, 3, 0, Math.PI*2);
      ctx.fill();
    }

    // Car body
    const carY = y + laneH/2;
    const lane0 = lane === 0;

    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur  = lane0 ? 14 : 6;

    // Body rect
    ctx.fillStyle = color;
    const bw = lane0 ? 24 : 18;
    const bh = lane0 ? 12 : 9;
    ctx.beginPath();
    ctx.roundRect(carX - bw/2, carY - bh/2, bw, bh, 3);
    ctx.fill();

    // Cockpit
    ctx.fillStyle = lane0 ? '#0a1520' : '#0a1520cc';
    ctx.beginPath();
    ctx.roundRect(carX - bw/4, carY - bh/2 + 2, bw/2, bh - 4, 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Position number on car
    if (pos > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${lane0?9:8}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(pos, carX, carY + 3);
    }
  }
}

// ── Question ──
function raceNextQuestion() {
  const q = genQuestion(raceState.type, raceState.diff);
  raceState.currentQ = q;
  document.getElementById('race-q-label').textContent =
    `QUESTION ${raceState.qi + 1} / ${raceState.trackLen}`;
  document.getElementById('race-q-expr').innerHTML = q.expr;
  const inp = document.getElementById('race-answer-input');
  inp.value = '';
  inp.className = 'answer-input';
  document.getElementById('race-feedback').textContent = '';
  document.getElementById('race-feedback').className = 'feedback-row';
  inp.focus();
}

function raceSubmit() {
  if (!raceState.running) return;
  const inp = document.getElementById('race-answer-input');
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || inp.value.trim() === '') return;

  const q = raceState.currentQ;
  const ok = val === q.ans;

  if (ok) {
    raceState.correct++;
    raceState.positions[0] = raceState.correct;
    inp.className = 'answer-input correct';
    document.getElementById('race-feedback').textContent = '✓';
    document.getElementById('race-feedback').className = 'feedback-row fb-correct';

    // Record time for first 3 answers (bot fallback)
    const elapsed = (performance.now() - raceState.timerStart) / 1000;
    if (raceState.correct <= 3) {
      raceState.playerTimes.push(elapsed);
      // After 3 answers, activate bot fallback for lanes with no history
      if (raceState.correct === 3) activateBotFallback(elapsed);
    }

    document.getElementById('race-q-counter').textContent =
      `${raceState.correct}/${raceState.trackLen}`;
    document.getElementById('race-correct-val').textContent = raceState.correct;

    drawRace();

    if (raceState.correct >= raceState.trackLen) {
      setTimeout(endRace, 200);
      return;
    }
  } else {
    raceState.errors++;
    inp.className = 'answer-input wrong';
    document.getElementById('race-feedback').textContent = `✗ 正解：${q.ans}`;
    document.getElementById('race-feedback').className = 'feedback-row fb-wrong';
    document.getElementById('race-err-val').textContent = raceState.errors;
  }

  const delay = ok ? 280 : 800;
  setTimeout(() => {
    if (!raceState.running) return;
    raceState.qi++;
    raceNextQuestion();
  }, delay);
}

function activateBotFallback(elapsed3) {
  // avg sec/step from first 3 answers
  const avgSec = elapsed3 / 3;
  const minSec = avgSec * 0.85;
  const maxSec = avgSec * 1.20;
  const tl = raceState.trackLen;

  for (let lane = 1; lane <= 5; lane++) {
    if (raceState.ghosts[lane] !== null) continue; // already has real ghost
    // assign random speed in [min, max]
    const spd = minSec + Math.random() * (maxSec - minSec);
    raceState.ghosts[lane] = spd;
    // start from current position
    const startPos = raceState.positions[lane];
    let steps = startPos;
    const t = setInterval(() => {
      if (!raceState.running) { clearInterval(t); return; }
      steps++;
      raceState.positions[lane] = Math.min(steps, tl);
      if (steps >= tl) clearInterval(t);
    }, spd * 1000);
    raceState.ghostTimers.push(t);
  }
}

// ── End race ──
function endRace() {
  stopRaceTimers();
  const time = parseFloat(raceState.elapsed.toFixed(2));
  const { type, diff, trackLen, errors } = raceState;

  // Save score
  saveRaceScore({ type, diff, trackLen, time, errors });

  // Compute rank vs saved scores
  const key = `${type}_${diff}_${trackLen}`;
  const scores = JSON.parse(localStorage.getItem(RACE_SCORES_KEY) || '{}');
  const runs = scores[key] || [];
  const rank = runs.findIndex(r => r.time === time) + 1 || runs.length;
  const rankStr = rank === 1 ? '🥇 第一名' : rank === 2 ? '🥈 第二名' : rank === 3 ? '🥉 第三名' : `第 ${rank} 名`;

  const grade = rank === 1 ? 'S' : rank === 2 ? 'A' : rank === 3 ? 'B' : 'C';
  document.getElementById('race-result-grade').textContent = grade;
  document.getElementById('race-result-grade').className   = 'result-grade grade-' + grade.toLowerCase();

  const isNew = runs.length > 0 && runs[0].time === time;
  document.getElementById('race-result-tagline').textContent = isNew ? '🎉 新紀錄！' : rankStr;
  document.getElementById('race-rs-time').textContent   = time + 's';
  document.getElementById('race-rs-errors').textContent = errors + '次';
  document.getElementById('race-rs-rank').textContent   = rankStr;

  // Best scores table
  renderRaceResultBest(type, diff, trackLen, time);

  showScreen('race-result');
}

function saveRaceScore({ type, diff, trackLen, time, errors }) {
  const key = `${type}_${diff}_${trackLen}`;
  const scores = JSON.parse(localStorage.getItem(RACE_SCORES_KEY) || '{}');
  if (!scores[key]) scores[key] = [];

  // Save prev-prev before updating last
  const prevLast = scores[key + '_last'] || null;
  if (prevLast) scores[key + '_prevprev'] = prevLast;

  // Save this run as last
  const date = new Date().toLocaleDateString('zh-TW');
  scores[key + '_last'] = { time, errors, date };

  // Update leaderboard
  scores[key].push({ time, errors, date });
  scores[key].sort((a, b) => a.time - b.time);
  scores[key] = scores[key].slice(0, 5);

  localStorage.setItem(RACE_SCORES_KEY, JSON.stringify(scores));
}

function renderRaceResultBest(type, diff, trackLen, myTime) {

  };
  const trackLabel = {5:'短賽道',10:'中賽道',20:'長賽道',50:'耐力賽'};

  let html = `<div class="scores-section" style="margin-bottom:0">

    <table class="scores-table">

          <td style="color:var(--gold);font-weight:700">${r.time}s</td>
          <td>${r.errors}次</td>
          <td style="font-size:.75rem;color:var(--ink-dim)">${r.date||''}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  document.getElementById('race-result-best').innerHTML = html;
}

</script>
</body>
</html>
